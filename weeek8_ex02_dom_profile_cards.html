<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Profile Card</title>
    <style>
      #profileCard {
        padding: 20px;
        border: 5px solid #367588;
        border-radius: 5px;
        width: 250px;
        transition: all 0.3s ease;
        background-color: #D8FFF8;
      }

      #profileCard.active-status {
        background-color: #F0FFF0;
        border-color: #708238;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      }

      button {
        margin-top: 5px;
        display: block;
        width: 100%;
        background-color: #708238;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Trainee Profile Card</h1>
    <div id="profileCard">
      <img src="https://placehold.co/100x100/jpeg" id="profileImage">
      <h2 id="profileName">John Doe</h2>
      <p id="profileRole">Software Developer</p>
      <p id="profileBio">Passionate about coding and learning new technologies.</p>
      <button id="updateNameBtn">Update Name</button>
      <button id="updateRoleBtn">Update Role</button>
      <button id="toggleStatusBtn">Toggle Active Status</button>
    </div>

    <script src="week8_ex02_dom_profile_card.js"></script>
  </body>
</html>
